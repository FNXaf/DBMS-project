<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowtopia Launcher</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #fffdf8;
      --text: #2a2318;
      --muted: #6c5d47;
      --accent: #b76e2b;
      --accent-dark: #7d4719;
      --border: #e6d8c8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at 20% 20%, #fff6df 0, transparent 40%),
        radial-gradient(circle at 80% 0%, #ffe9c8 0, transparent 35%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(60, 30, 10, 0.12);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }

    p {
      color: var(--muted);
      line-height: 1.55;
      margin: 0.4rem 0 1rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    a.button {
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      color: white;
      background: var(--accent);
      font-weight: 700;
    }

    a.button.secondary {
      background: transparent;
      color: var(--accent-dark);
      border-color: var(--border);
    }

    code {
      background: #f2eadf;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Meowtopia Project Launcher</h1>
    <p>
      You opened the project root in Live Server. Start the app from the frontend entry page.
    </p>
    <div class="actions">
      <a class="button" href="frontend/index.html">Open Frontend App</a>
      <a class="button secondary" href="http://localhost:5000/api/health">Check Backend Health</a>
    </div>
    <p style="margin-top:16px;">
      Demo admin login: <code>admin@meowtopia.com</code> / <code>admin123</code><br>
      Demo user login: <code>user1@example.com</code> / <code>sam123</code>
    </p>
  </main>
</body>
</html>
